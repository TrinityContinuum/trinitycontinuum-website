name: Analytics browser consent
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'privacy.html'
      - 'index.html'
      - 'tests/analytics-browser.spec.cjs'
      - '.github/workflows/analytics-browser.yml'
  workflow_dispatch:
jobs:
  browser-consent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/trinity-http.log 2>&1 &
      - run: npx playwright test tests/analytics-browser.spec.cjs --browser chromium --workers 1
