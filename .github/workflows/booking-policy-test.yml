name: Draft Jack booking hours, federal holiday and collision tests
on:
  push:
    branches: [feature/trinity-central-booking-policy]
    paths:
      - 'tests/booking-policy.test.mjs'
      - 'tests/booking-api.test.mjs'
      - 'cloudflare/appointment-queue/direct-booking.js'
      - 'cloudflare/appointment-queue/004_direct_booking.sql'
      - '.github/workflows/booking-policy-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/booking-policy.test.mjs tests/booking-api.test.mjs
