# Historical one-time deployment workflow. The Worker was created on
# 2026-11-22 and verified live. This file is now a SAFE read-only guard,
# not a redeployment mechanism. Git history preserves the original installer.
name: Independent booking bootstrap retired (read-only)
on:
  push:
    branches: [feature/trinity-central-booking-policy]
    paths: [.github/workflows/deploy-independent-booking-disabled.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-deployed-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect existing Worker safely; no redeploy or D1 writes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}" || { echo "::error::Cloudflare credential not configured"; exit 1; }
          ACCOUNT="c1c16121076a98e0c060349aebfae11a"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/workers/scripts/trinity-independent-booking/settings" \
            -o /tmp/existing-worker-settings.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/existing-worker-settings.json'))
          if not obj.get('success'):raise SystemExit('Existing Worker inspection failed')
          res=obj.get('result') or {}
          cfg=res.get('settings') if isinstance(res.get('settings'),dict) else res
          bindings=cfg.get('bindings',[]) if isinstance(cfg,dict) else []
          hard_off=any(b.get('name')=='DIRECT_BOOKING_ENABLED' and str(b.get('text',b.get('value',''))).lower()=='false' for b in bindings)
          d1=any(b.get('name')=='DB' and b.get('type')=='d1' for b in bindings)
          if not hard_off or not d1:raise SystemExit('Existing Worker does not match approved disabled deployment')
          print('PASS: existing independent booking Worker found; D1 bound; direct booking OFF.')
          print('One-time bootstrap archived. No code deployment, D1 migration or appointment changes.')
          print('For current live HTTP acceptance, use verify-independent-booking-live.yml.')
          PY
