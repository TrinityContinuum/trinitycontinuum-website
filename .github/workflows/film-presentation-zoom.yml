name: Film presentation full-page zoom acceptance
on:
  pull_request:
    paths:
      - 'film-presentations.html'
      - 'assets/film-presentation-zoom.js'
      - 'assets/film-presentation-zoom.css'
      - 'tests/film-presentation-zoom.spec.cjs'
      - '.github/workflows/film-presentation-zoom.yml'
  push:
    branches: [main]
    paths:
      - 'film-presentations.html'
      - 'assets/film-presentation-zoom.js'
      - 'assets/film-presentation-zoom.css'
      - 'tests/film-presentation-zoom.spec.cjs'
      - '.github/workflows/film-presentation-zoom.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve presentation locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/trinity-film-zoom.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/film-presentations.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Verify four existing films, fullscreen fallback, zoom, mobile and Escape
        run: npx playwright test tests/film-presentation-zoom.spec.cjs --browser chromium --workers 1 --reporter=line
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: film-presentation-zoom-browser-diagnostics
          path: test-results/
          retention-days: 7
