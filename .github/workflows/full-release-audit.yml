name: Full draft site release audit
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**/*.js'
      - 'assets/**/*.css'
      - 'sitemap.xml'
      - 'tests/full-release-audit.spec.cjs'
      - '.github/workflows/full-release-audit.yml'
  workflow_dispatch:
jobs:
  full-site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Serve reviewed draft locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/trinity-audit-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/sitemap.xml >/dev/null && exit 0 || sleep 1; done
          exit 1
      - name: Test 32 sitemap pages, mobile, accessibility basics and internal links
        run: npx playwright test tests/full-release-audit.spec.cjs --browser chromium --workers 2 --reporter=line
