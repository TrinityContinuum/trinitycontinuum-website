name: Private appointment administration acceptance (no writes)
on:
  push:
    branches: [main]
    paths:
      - 'tests/private-appointment-admin.test.mjs'
      - 'cloudflare/appointment-queue/admin.js'
      - '.github/workflows/private-appointment-admin-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-private-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test private queue protection and manual approval, no sends
        run: node --test tests/private-appointment-admin.test.mjs
  public-auth-barrier:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe existing private Worker URLs without credentials or writes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          origin='https://trinity-appointment-admin.jackspurewater.workers.dev'
          for path in ['/', '/api/requests','/api/automation-status','/api/decisions']:
              url=origin+path
              req=urllib.request.Request(url,headers={'User-Agent':'Trinity-private-appointments-security-gate/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=16) as r: status=r.status
              except urllib.error.HTTPError as e:status=e.code
              except Exception as e:
                  print(f'NOT VERIFIED {path}: {type(e).__name__}')
                  raise SystemExit(1)
              print('Unauthenticated admin endpoint',path,'HTTP',status)
              if status!=401:
                  print('HOLD: private Worker authentication or hostname must be verified by authorized Cloudflare owner')
                  raise SystemExit(1)
          print('PASS: deployed private administrative routes refuse all unauthenticated requests; authorized queue readback separately required.')
          PY
