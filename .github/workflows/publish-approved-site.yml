name: Publish approved Trinity website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'CNAME'
      - '.github/workflows/publish-approved-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trinity-pages-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out approved official main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify approved release assets
        run: |
          test -s index.html
          test -s publications.html
          test -s CNAME
          grep -q 'trinitycontinuum.com' CNAME
          grep -q 'publications.html' index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload approved official website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy approved website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
