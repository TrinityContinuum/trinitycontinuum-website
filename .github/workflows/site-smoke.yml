name: Website browser smoke tests
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site-smoke.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/trinity-site.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test desktop and mobile
        run: npx playwright test tests/site.spec.cjs --reporter=line
