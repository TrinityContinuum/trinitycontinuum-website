name: Eight-trailer presentation walkthrough acceptance
on:
  pull_request:
    paths:
      - 'film-presentations.html'
      - 'assets/trailer-walkthrough*.svg'
      - 'assets/trailer-walkthrough.js'
      - 'assets/trailer-walkthrough.css'
      - 'tests/trailer-walkthrough.spec.cjs'
      - '.github/workflows/trailer-walkthrough.yml'
  push:
    branches: [main]
    paths:
      - 'film-presentations.html'
      - 'assets/trailer-walkthrough*.svg'
      - 'assets/trailer-walkthrough.js'
      - 'assets/trailer-walkthrough.css'
      - 'tests/trailer-walkthrough.spec.cjs'
      - '.github/workflows/trailer-walkthrough.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-trailer-presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local page server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/trinity-trailer-walkthrough.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/film-presentations.html > /dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Test all eight trailer functions, navigation, accessibility basics and mobile
        run: npx playwright test tests/trailer-walkthrough.spec.cjs --browser chromium --workers 1 --reporter=line
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trailer-walkthrough-test-results
          path: test-results/
          retention-days: 7
