name: Verify Trinity Cloudflare deployment access
on:
  push:
    branches:
      - feature/automatic-booking-owner-controls-20261119
    paths:
      - .github/workflows/verify-cloudflare-booking.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token can access Cloudflare account
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: c1c16121076a98e0c060349aebfae11a
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing"
            exit 1
          fi
          response=$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/tokens/verify")
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True, "Cloudflare token verification failed"; print("Cloudflare token verified; no resources changed.")'
      - name: No production changes
        run: echo "Verification only. No Workers, D1 migrations, DNS, or production deployments."
