<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1164 560" role="img" aria-labelledby="title desc"><title id="title">Trinity Continuum eight-trailer Texas development configuration</title><desc id="desc">Eight distinct trailer illustrations, numbered one through eight. Trailers one through six represent the integrated water, power and thermal utility core, trailer seven is the BFS trailer and trailer eight is the data-center trailer. Conceptual counts and groupings only, not approved layout or fabrication geometry.</desc><rect width="1164" height="560" rx="24" fill="#091927"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#f5d99f">EIGHT TRAILERS. ONE TEXAS CONFIGURATION.</text><text x="38" y="84" font-family="Arial,sans-serif" font-size="18" fill="#dcebf2">Six-trailer integrated water + power + thermal utility core, plus two additional trailers.</text><rect x="34" y="109" width="1100" height="199" rx="17" fill="none" stroke="#4b7184" stroke-dasharray="8 6"/><rect x="34" y="314" width="538" height="165" rx="17" fill="none" stroke="#4b7184" stroke-dasharray="8 6"/><g role="group" aria-label="Trailer 01: Core unit 1"><rect x="38" y="144" width="256" height="142" rx="14" fill="#12334a" stroke="#7eb5cf" stroke-width="2"/><rect x="50" y="158" width="232" height="114" rx="8" fill="#0b1d2e" stroke="#365c74"/><text x="64" y="199" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#f1cf8d">01</text><text x="64" y="229" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#f7fafc">Core unit 1</text><text x="64" y="253" font-family="Arial,sans-serif" font-size="12" fill="#afd1df">UTILITY CORE</text></g>
