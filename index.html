<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Trinity Continuum | Opening Film</title>
<style>html,body{margin:0;min-height:100%;background:#000;color:white;font-family:system-ui,sans-serif}main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain}nav{position:absolute;top:16px;right:16px;display:flex;flex-wrap:wrap;gap:10px;z-index:2}button,a{background:#07111ee8;color:white;border:1px solid #ffffff99;border-radius:8px;padding:12px 16px;font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}#status{position:absolute;bottom:25px;left:16px;right:16px;text-align:center;text-shadow:0 1px 5px black}button[hidden]{display:none}</style></head>
<body><main aria-label="Trinity Continuum opening film"><video id="intro" src="assets/trinity-intro-captioned.mp4" playsinline preload="auto" autoplay muted aria-label="Trinity Continuum captioned opening film"></video>
<nav><button id="sound" type="button">Play with Sound</button><a href="film-presentations.html" id="skip">Skip Intro · View Presentations</a></nav><p id="status" aria-live="polite">Trinity Continuum opening film</p></main>
<script>
(function(){
  const video=document.getElementById('intro'),sound=document.getElementById('sound'),status=document.getElementById('status');
  const destination='film-presentations.html';
  if(new URLSearchParams(location.search).get('view')==='site'){location.replace('full-site.html');return;}
  video.addEventListener('ended',()=>location.assign(destination));
  video.addEventListener('error',()=>{status.textContent='The opening film could not load. Continue to the presentations above.';});
  sound.addEventListener('click',async()=>{video.muted=false;try{await video.play();sound.hidden=true;}catch(e){video.muted=true;status.textContent='Your browser requires muted playback. Use Skip Intro to continue.';video.play().catch(()=>{});}});
  video.play().catch(()=>{status.textContent='Select Play with Sound to begin, or Skip Intro to continue.';});
})();
</script></body></html>
